name: Build MAHMOUD VPN

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name 'MAHMOUD-VPN-with-AboWaged-servers.zip' -print -quit)
          test -n "$ZIP"
          mkdir extracted
          unzip -o "$ZIP" -d extracted
          cp -r extracted/MAHMOUD-VPN/. . 2>/dev/null || cp -r extracted/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAHMOUD-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
