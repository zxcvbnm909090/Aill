name: Build MAHMOUD VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        run: |
          unzip -o MAHMOUD-VPN-with-AboWaged-servers.zip -d extracted

      - name: Build APK
        working-directory: extracted/mahmoudvpn_project2
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAHMOUD-VPN-APK
          path: extracted/mahmoudvpn_project2/app/build/outputs/apk/debug/*.apk
